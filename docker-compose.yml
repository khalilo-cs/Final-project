# Local development stack.
#   docker compose up --build                 -> postgres + implemented services
#   docker compose --profile infra up -d      -> also redis, rabbitmq, minio (used by later phases)

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - auth-service
      - project-service
      - viva-engine
      - speech-service

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-[]}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-}
      OIDC_FACULTY_VALUES: ${OIDC_FACULTY_VALUES:-[]}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-}
      LDAP_FACULTY_GROUPS: ${LDAP_FACULTY_GROUPS:-[]}
      LDAP_STUDENT_ID_ATTRIBUTE: ${LDAP_STUDENT_ID_ATTRIBUTE:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  project-service:
    build: ./services/project-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STORAGE_DIR: /data
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-4}
      CODE_ANALYZER_URL: http://code-analyzer:8003
      DB_ANALYZER_URL: http://db-analyzer:8004
      REPORT_ANALYZER_URL: http://report-analyzer:8005
      AUTH_SERVICE_URL: http://auth-service:8001
      VIVA_ENGINE_URL: http://viva-engine:8006
      FRAUD_DETECTOR_URL: http://fraud-detector:8007
      SANDBOX_RUNNER_URL: http://sandbox-runner:8008
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-AI Project Examiner <no-reply@localhost>}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      REPORT_GENERATOR_URL: http://report-generator:8009
    volumes:
      - project-files:/data
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      code-analyzer:
        condition: service_started
      db-analyzer:
        condition: service_started
      report-analyzer:
        condition: service_started
      fraud-detector:
        condition: service_started

  code-analyzer:
    build: ./services/code-analyzer
    environment:
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8003:8003"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  db-analyzer:
    build: ./services/db-analyzer
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8004:8004"
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  report-analyzer:
    build: ./services/report-analyzer
    environment:
      # Plagiarism fingerprint index (tables: documents, fingerprints).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  fraud-detector:
    build: ./services/fraud-detector
    environment:
      # Code fingerprint index (tables: code_documents, code_fingerprints).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  report-generator:
    build: ./services/report-generator
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8009:8009"
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Speech-to-text for spoken viva answers (Whisper). Audio stays on this server with
  # the default local engine; the model (~500 MB for "small") downloads on first use.
  speech-service:
    build: ./services/speech-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SPEECH_BACKEND: ${SPEECH_BACKEND:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      REMOTE_URL: ${SPEECH_REMOTE_URL:-}
      REMOTE_MODEL: ${SPEECH_REMOTE_MODEL:-whisper-1}
      REMOTE_API_KEY: ${SPEECH_REMOTE_API_KEY:-}
    volumes:
      - whisper-models:/models
    ports:
      - "127.0.0.1:8010:8010"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Runs student projects in throw-away containers to measure performance.
  # SECURITY: access to the Docker socket is root-equivalent on the host. Run this on a
  # dedicated machine or VM in production, never next to sensitive data.
  backup:
    # Daily database + uploaded-files backup (NFR-05); see tools/backup/README.md.
    image: postgres:16-alpine
    command: ["/tools/schedule.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./tools/backup:/tools:ro
      - project-files:/data
      - ${BACKUP_PATH:-./backups-data}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  sandbox-runner:
    build:
      context: ./services/sandbox-runner
      args:
        SCREENSHOTS: ${SANDBOX_SCREENSHOTS:-1}
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SANDBOX_NETWORK: aipe-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [default, sandbox]
    ports:
      - "127.0.0.1:8008:8008"

  viva-engine:
    build: ./services/viva-engine
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Optional models. With none of them the built-in engine runs the viva alone.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CLAUDE_ENABLED: ${CLAUDE_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_COMPATIBLE_URL: ${OPENAI_COMPATIBLE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      postgres:
        condition: service_healthy

  # Local model server (free, private). Start with: docker compose --profile ai up -d
  # then: docker compose exec ollama ollama pull qwen2.5:7b, and set OLLAMA_URL in .env.
  ollama:
    image: ollama/ollama
    profiles: [ai]
    volumes:
      - ollama-models:/root/.ollama

  redis:
    image: redis:7-alpine
    profiles: [infra]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: [infra]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aipe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:15672:15672"

  minio:
    image: minio/minio
    profiles: [infra]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aipe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"

networks:
  default: {}
  # Student code runs here: internal = no route to the internet.
  sandbox:
    name: aipe-sandbox
    internal: true

volumes:
  postgres-data:
  whisper-models:
  project-files:
  ollama-models:
  minio-data:

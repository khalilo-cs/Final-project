[workspace]
resolver = "2"
members = [
    "crates/dhad-diagnostics",
    "crates/dhad-syntax",
    "crates/dhad-interp",
    "crates/dhad-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/khalilo-cs/Final-project"
authors = ["مشروع ضاد"]

[workspace.dependencies]
dhad-diagnostics = { path = "crates/dhad-diagnostics" }
dhad-syntax = { path = "crates/dhad-syntax" }
dhad-interp = { path = "crates/dhad-interp" }
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true

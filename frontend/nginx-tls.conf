# HTTPS mode (NFR-02: data encrypted in transit). Certificates are mounted at
# /etc/nginx/certs (fullchain.pem + privkey.pem): see docker-compose.tls.yml.

include /etc/nginx/mihakk/http.inc;

server {
    listen 80;
    server_tokens off;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/mihakk/site.inc;
}

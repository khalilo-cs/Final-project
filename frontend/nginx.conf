# Same paths as the Vite dev proxy (vite.config.ts): one origin for the browser.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    location /svc/auth/     { proxy_pass http://auth-service:8001/; }
    location /svc/projects/ { proxy_pass http://project-service:8002/; proxy_read_timeout 300s; }
    location /svc/viva/     { proxy_pass http://viva-engine:8006/; proxy_read_timeout 180s; }

    # Internal service-to-service endpoints are never exposed to browsers.
    location ~ ^/svc/[a-z]+/internal/ { return 404; }
    location ~ ^/svc/auth/api/v1/internal/ { return 404; }

    location / {
        try_files $uri /index.html;
    }
}

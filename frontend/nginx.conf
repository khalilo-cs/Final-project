# Same paths as the Vite dev proxy (vite.config.ts): one origin for the browser.
# nginx is also the API gateway: routing, rate limiting and security headers.
# HTTP mode (development, or behind the university's own TLS proxy).
# For HTTPS on this server use nginx-tls.conf: see docker-compose.tls.yml.

include /etc/nginx/mihakk/http.inc;

server {
    listen 80;
    include /etc/nginx/mihakk/site.inc;
}

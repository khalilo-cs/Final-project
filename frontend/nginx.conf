# Same paths as the Vite dev proxy (vite.config.ts): one origin for the browser.
# nginx is also the API gateway: routing, rate limiting and security headers.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Password guessing: a few attempts per minute per address (auth-service also locks
    # an account after repeated failures).
    location = /svc/auth/api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://auth-service:8001/api/v1/auth/login;
    }
    location /svc/auth/     { limit_req zone=api burst=40 nodelay; proxy_pass http://auth-service:8001/; }
    location /svc/projects/ { limit_req zone=api burst=40 nodelay; proxy_pass http://project-service:8002/; proxy_read_timeout 300s; }
    location /svc/viva/     { limit_req zone=api burst=40 nodelay; proxy_pass http://viva-engine:8006/; proxy_read_timeout 180s; }

    # Internal service-to-service endpoints are never exposed to browsers.
    location ~ ^/svc/[a-z]+/internal/ { return 404; }
    location ~ ^/svc/auth/api/v1/internal/ { return 404; }

    location / {
        try_files $uri /index.html;
    }
}

[package]
name = "dhad-lsp"
description = "خادم اللغة (LSP) للغة ضاد: تشخيص، إكمال، تلميحات، انتقال للتعريف، إعادة تسمية"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dhad-lsp"
path = "src/main.rs"

[dependencies]
dhad-diagnostics = { workspace = true }
dhad-syntax = { workspace = true }
dhad-analysis = { workspace = true }
lsp-server = "0.10.0"
lsp-types = "0.97"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
